name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Confirm Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler whoami | tee /tmp/whoami.txt; then
            echo "CLOUDFLARE_API_TOKEN was rejected. Create an Edit Cloudflare Workers token for account e92e65d94443672fda698d100337efcf and store it as the CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if ! grep -q "e92e65d94443672fda698d100337efcf" /tmp/whoami.txt; then
            echo "Refusing to deploy: this token is not the live account e92e65d94443672fda698d100337efcf."
            exit 1
          fi
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
